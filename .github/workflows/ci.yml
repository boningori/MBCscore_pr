name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # テストは tsc -b（= npm run build）の対象外なので別で型検査する。
      # tsconfig.app.json が *.test.ts(x) を exclude しているため、
      # これが無いとテスト内の型エラーも @ts-expect-error の不発も素通りする
      - run: npm run typecheck:test
      - run: npm test
      - run: npm run build
      # デプロイジョブは再ビルドせずこの成果物を配る。
      # 「テストが通ったもの」と「公開されるもの」を同一にするため
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  # main への push だけ公開する。以前は手元の npm run deploy だったため、
  # 作業ツリーが汚れたままの成果物が出る余地があった。
  # Pages の配信元は gh-pages ブランチのままにしてある（リポジトリ設定を
  # 変えずに済ませるため）。
  deploy:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: deploy-gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # devDependency の gh-pages をそのまま使う（手元の手順と同じ道具）。
      # サードパーティのactionを増やさない
      # gh-pages は自前でリポジトリをcloneするため、checkout が持っている
      # 認証情報を引き継がない（fatal: could not read Username）。
      # -r で認証付きのリモートURLを渡す。
      #
      # コミット作者は git config で渡す。gh-pages の -u オプションは
      # "github-actions[bot] <...>" を解析できずに落ちる（角括弧が通らない）
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npx gh-pages -d dist \
            -r "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            -m "Deploy ${{ github.sha }}"
