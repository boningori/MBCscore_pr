name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # テストは tsc -b（= npm run build）の対象外なので別で型検査する。
      # tsconfig.app.json が *.test.ts(x) を exclude しているため、
      # これが無いとテスト内の型エラーも @ts-expect-error の不発も素通りする
      - run: npm run typecheck:test
      - run: npm test
      - run: npm run build
      # デプロイジョブは再ビルドせずこの成果物を配る。
      # 「テストが通ったもの」と「公開されるもの」を同一にするため
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  # E2E（Playwright）。test-and-build が作った dist をそのまま preview で配って回す。
  #
  # deploy の needs に入れてある（2026-09-20 に昇格）。判断は済んでいるので、
  # 次の版で見直す予定は無い。
  #
  # 経緯。jsdom で踏めない4経路（オフライン起動・戻る操作・自動保存のフラッシュ・
  # ミラー復元）を足した直後は前提が変わったとみて、v1.12 で据え置いた。
  # そのとき昇格条件を数字で決めた ——「新しい4経路を含む main の CI が
  # 10回連続で成功し、その間フレークが1度も出ていないこと」。
  #
  # 2026-09-20 に数えたところ、条件を満たしていた。根拠:
  # 4経路が入った 626e0e0（Merge: jsdom で踏めない経路を e2e で守る、2026-09-11）
  # から直近の main まで、e2e ジョブが 16回連続で成功。再実行（run attempt 2 以上）
  # は0件、Playwright の flaky も0件。10回を超えているため needs へ入れた。
  #
  # 数え方の注意。ジョブの成功/失敗だけを見ても足りない。CI では
  # playwright.config.ts が retries: 1 なので、1度落ちて再試行で通った場合でも
  # ジョブは success になる。そのため16回ぶんのログまで見て「N flaky」が
  # 出ていないことを確かめている。同種の判断をするときも結論だけで済ませないこと。
  #
  # 遅れた事実も残す。この判断は本来 v1.13 を切るときに行うはずだったが、
  # v1.13〜v1.17 まで誰も見直さないまま過ぎ、2026-09-20 に指摘されて初めて
  # 実施した。v1.11 で「次のマイナーで判断する」と書いて黙って過ぎたのと同じ
  # 失敗を、条件を数字にしたうえでなお繰り返している。効かなかったのは条件の
  # 精度ではなく「版番号を期限にする」という形のほう。今後この種の保留を作る
  # ときは版番号で期限を切らず、CI 自身が落ちて気づける形（判定を行うジョブを
  # 足す、期限を過ぎたら失敗するチェックを置く等）にすること。
  #
  # これ以降、e2e が落ちると main は公開されない。落ちたら原因を潰してから
  # main へ入れる。赤を避けるために needs から e2e を外すのはこの判断の
  # 取り消しにあたるので、外すなら理由と再昇格の条件をここに書き残すこと。
  e2e:
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # chromium だけ入れる（playwright.config.ts の projects と揃える）。
      # --with-deps はヘッドレスChromiumが要るシステムライブラリを入れる
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # 失敗したときだけレポートを残す。成功時の成果物は誰も見ない
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # main への push だけ公開する。以前は手元の npm run deploy だったため、
  # 作業ツリーが汚れたままの成果物が出る余地があった。
  # Pages の配信元は gh-pages ブランチのままにしてある（リポジトリ設定を
  # 変えずに済ませるため）。
  deploy:
    # e2e も待つ（2026-09-20 に追加。理由は e2e ジョブの上のコメント）。
    # dist は test-and-build の成果物をそのまま使う。e2e は同じ dist を
    # 検査しているので、待っても配る中身は変わらない
    needs: [test-and-build, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: deploy-gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # devDependency の gh-pages をそのまま使う（手元の手順と同じ道具）。
      # サードパーティのactionを増やさない
      # gh-pages は自前でリポジトリをcloneするため、checkout が持っている
      # 認証情報を引き継がない（fatal: could not read Username）。
      # -r で認証付きのリモートURLを渡す。
      #
      # コミット作者は git config で渡す。gh-pages の -u オプションは
      # "github-actions[bot] <...>" を解析できずに落ちる（角括弧が通らない）
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npx gh-pages -d dist \
            -r "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            -m "Deploy ${{ github.sha }}"
