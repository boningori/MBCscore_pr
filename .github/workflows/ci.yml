name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # テストは tsc -b（= npm run build）の対象外なので別で型検査する。
      # tsconfig.app.json が *.test.ts(x) を exclude しているため、
      # これが無いとテスト内の型エラーも @ts-expect-error の不発も素通りする
      - run: npm run typecheck:test
      - run: npm test
      - run: npm run build
      # デプロイジョブは再ビルドせずこの成果物を配る。
      # 「テストが通ったもの」と「公開されるもの」を同一にするため
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  # E2E（Playwright）。test-and-build が作った dist をそのまま preview で配って回す。
  #
  # deploy の needs には入れていない。
  #
  # 当初の条件（実ブラウザ特有の不安定さが出ないことの確認）は満たされた ——
  # 出力3件で 10回連続成功、フレーク無し。それでも据え置くのは、jsdom で踏めない
  # 4経路（オフライン起動・戻る操作・自動保存のフラッシュ・ミラー復元）を
  # 足したばかりで、前提が変わったため。とくにオフラインは SW の有効化待ちが
  # 絡み、この中では最も揺れやすい。
  #
  # v1.12 を切るときに判断し、据え置いた。新しい4経路の main での実績が
  # まだ2回しかなく、昇格の根拠にするには薄いため。
  #
  # 次は v1.13 を切るときに判断する。そのときの昇格条件を数字で決めておく:
  # 「新しい4経路を含む main の CI が 10回連続で成功し、その間フレークが
  # 1度も出ていないこと」。満たしていれば deploy の needs へ入れる。
  # 満たしていなければ、落ちた経路と原因をここに書き残してから据え置く。
  #
  # 条件を数字にするのは、v1.11 のときに「次のマイナーで判断する」とだけ
  # 書いて、実際にはその期限を黙って過ぎたため。期限だけでは足りない。
  e2e:
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # chromium だけ入れる（playwright.config.ts の projects と揃える）。
      # --with-deps はヘッドレスChromiumが要るシステムライブラリを入れる
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # 失敗したときだけレポートを残す。成功時の成果物は誰も見ない
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # main への push だけ公開する。以前は手元の npm run deploy だったため、
  # 作業ツリーが汚れたままの成果物が出る余地があった。
  # Pages の配信元は gh-pages ブランチのままにしてある（リポジトリ設定を
  # 変えずに済ませるため）。
  deploy:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: deploy-gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # devDependency の gh-pages をそのまま使う（手元の手順と同じ道具）。
      # サードパーティのactionを増やさない
      # gh-pages は自前でリポジトリをcloneするため、checkout が持っている
      # 認証情報を引き継がない（fatal: could not read Username）。
      # -r で認証付きのリモートURLを渡す。
      #
      # コミット作者は git config で渡す。gh-pages の -u オプションは
      # "github-actions[bot] <...>" を解析できずに落ちる（角括弧が通らない）
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npx gh-pages -d dist \
            -r "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            -m "Deploy ${{ github.sha }}"
