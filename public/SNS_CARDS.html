<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBCscore SNS投稿カード</title>
    <style>
        :root {
            --primary-bg: #0a1628;
            --secondary-bg: #111d35;
            --accent-blue: #3b82f6;
            --accent-blue-dark: #2563eb;
            --accent-green: #10b981;
            --accent-orange: #f59e0b;
            --accent-red: #ef4444;
            --text-white: #f1f5f9;
            --text-muted: #94a3b8;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Helvetica Neue', Arial, sans-serif;
            color: var(--text-white);
            padding: 40px 20px 80px;
        }

        .page-header {
            max-width: 1080px;
            margin: 0 auto 32px;
            text-align: center;
        }
        .page-header h1 { font-size: 24px; margin-bottom: 8px; }
        .page-header p { font-size: 14px; color: var(--text-muted); line-height: 1.7; }

        /* ====== カードフレーム（画面上は50%縮小、トグルで実寸） ====== */
        .card-frame {
            width: 540px;
            height: 540px;
            margin: 0 auto 48px;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }
        .card {
            width: 1080px;
            height: 1080px;
            transform: scale(0.5);
            transform-origin: top left;
            background: var(--primary-bg);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        body.fullsize .card-frame { width: 1080px; height: 1080px; }
        body.fullsize .card { transform: none; }

        /* ====== カード背景装飾 ====== */
        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }
        .orb--blue {
            width: 700px; height: 700px; top: -260px; right: -220px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.30) 0%, transparent 70%);
        }
        .orb--green {
            width: 560px; height: 560px; bottom: -220px; left: -180px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.22) 0%, transparent 70%);
        }

        /* ====== カード内共通パーツ ====== */
        .card-body {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 72px 80px 0;
        }
        .card-kicker {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: var(--accent-orange);
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 72px;
            font-weight: 900;
            line-height: 1.25;
            margin-bottom: 24px;
        }
        .card-title .accent { color: var(--accent-blue); }
        .card-lead {
            font-size: 34px;
            line-height: 1.6;
            color: var(--text-muted);
        }
        .card-visual {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
        }
        .card-footer {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 80px 56px;
        }
        .footer-brand {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 34px;
            font-weight: 900;
        }
        .footer-brand img { width: 56px; height: 56px; border-radius: 12px; }
        .footer-url {
            font-size: 28px;
            color: var(--accent-blue);
            font-weight: 700;
        }

        .glass-panel {
            background: var(--glass-bg);
            border: 2px solid var(--glass-border);
            border-radius: 28px;
            padding: 40px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--glass-bg);
            border: 2px solid var(--glass-border);
            border-radius: 999px;
            padding: 16px 36px;
            font-size: 32px;
            font-weight: 700;
        }

        /* ====== 表示切替ボタン ====== */
        #sizeToggle {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 10;
            background: var(--accent-blue);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }
    </style>
</head>
<body>
    <button id="sizeToggle" onclick="document.body.classList.toggle('fullsize'); this.textContent = document.body.classList.contains('fullsize') ? '縮小表示に戻す' : '実寸表示 (1080px)';">実寸表示 (1080px)</button>

    <div class="page-header">
        <h1>🏀 MBCscore SNS投稿カード</h1>
        <p>各カードは実寸1080×1080pxです。「実寸表示」に切り替えてカード単位でスクリーンショットを撮り、<br>X / Instagram の投稿画像として使用してください。文面は docs/marketing/sns-posts.md 参照。</p>
    </div>

    <!-- CARD_SLOT -->

</body>
</html>
